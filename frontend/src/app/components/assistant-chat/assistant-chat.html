<div class="assistant-chat" [class.assistant-chat--initial]="initialState()">
  <app-product-edit-dialog
    [visible]="editDialogVisible()"
    [productName]="editDialogProductName()"
    [productQuantity]="editDialogProductQuantity()"
    (accepted)="onEditAccepted($event)"
    (close)="editDialogVisible.set(false)"
  />
  @if (initialState()) {
    <div class="assistant-chat__initial-logo">
      <p class="assistant-chat__initial-title">Smart</p>
      <p class="assistant-chat__initial-title">pantry</p>
    </div>
    <input
      type="text"
      class="assistant-chat__initial-input"
      placeholder="Hey 👋"
      [(ngModel)]="userPrompt"
      (keyup.enter)="sendPrompt()"
      [disabled]="loading()"
      autocomplete="off"
    />
  } @else {
    <div class="assistant-chat__conversation">
      <div class="assistant-chat__conversation-scroll" #scrollContainer>
        <div class="assistant-chat-logo">
          <p class="assistant-chat-title">Smart</p>
          <p class="assistant-chat-title">pantry</p>
        </div>
        <div class="assistant-chat__conversation-scroll-messages">
          @for (message of chatHistory(); track message.id) {
            <app-assistant-chat-message [message]="message" />
          }
        </div>
      </div>
      <div class="assistant-chat__conversation-wrapper">
        <input
          type="text"
          placeholder="Ask me anything about your pantry..."
          [(ngModel)]="userPrompt"
          (keyup.enter)="sendPrompt()"
          [disabled]="loading()"
          autocomplete="off"
        />
        <p-button icon="pi pi-send" variant="outlined" (onClick)="sendPrompt()" />
      </div>
    </div>
  }
</div>
