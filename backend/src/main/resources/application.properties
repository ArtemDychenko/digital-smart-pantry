spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/pantry
spring.datasource.username=pantry
spring.datasource.password=pantry

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

server.port=8080

spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.chat.options.model=qwen2.5:3b

spring.ai.chat.memory.repository.jdbc.initialize-schema=always